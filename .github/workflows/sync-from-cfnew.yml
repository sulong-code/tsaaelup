name: 从 cfnew 同步 Releases

on:
  workflow_dispatch:  # 手动触发
  schedule:
    - cron: '0 */6 * * *'  # 每6小时自动检查一次

permissions:
  contents: write

concurrency:
  group: sync-from-cfnew
  cancel-in-progress: false

jobs:
  sync-release:
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 获取 cfnew 最新发布
        id: get_latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # 带 token 请求，避免 60 次/小时匿名限流
          LATEST_RELEASE=$(curl -sS --fail \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/byJoey/cfnew/releases/latest)

          echo "正在获取最新发布信息..."
          echo "$LATEST_RELEASE" | head -c 400; echo

          # GitHub API 返回紧凑 JSON（"tag_name":"v..."，冒号后无空格），
          # 同时兼容带空格的排版，两种写法都能匹配。
          VERSION=$(echo "$LATEST_RELEASE" \
            | grep -o '"tag_name": *"[^"]*"' \
            | head -1 \
            | sed 's/.*"tag_name": *"\([^"]*\)".*/\1/')

          if [ -z "${VERSION}" ]; then
            echo "错误：未能从 release JSON 中解析出 tag_name"
            echo "$LATEST_RELEASE" | head -c 800
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "最新版本: $VERSION"

          # assets_url 同样兼容两种排版
          ASSETS_URL=$(echo "$LATEST_RELEASE" \
            | grep -o '"assets_url": *"[^"]*"' \
            | head -1 \
            | sed 's/.*"assets_url": *"\([^"]*\)".*/\1/')

          if [ -z "${ASSETS_URL}" ]; then
            echo "错误：未能解析 assets_url"
            exit 1
          fi
          echo "正在获取文件列表: $ASSETS_URL"

          ASSETS=$(curl -sS --fail \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$ASSETS_URL")

          # 优先取 Pages.zip；上游若改名则回退取 _worker.js
          if echo "$ASSETS" | jq -e '.[] | select(.name=="Pages.zip")' >/dev/null 2>&1; then
            FILE_NAME="Pages.zip"
          else
            FILE_NAME="_worker.js"
          fi
          DL_URL=$(echo "$ASSETS" | jq -r --arg n "$FILE_NAME" '.[] | select(.name==$n) | .browser_download_url')

          if [ -z "$DL_URL" ] || [ "$DL_URL" = "null" ]; then
            echo "错误：未找到 $FILE_NAME"
            echo "$ASSETS" | jq -r '.[].name' || echo "$ASSETS" | head -c 600
            exit 1
          fi

          echo "file_name=$FILE_NAME" >> "$GITHUB_OUTPUT"
          echo "download_url=$DL_URL" >> "$GITHUB_OUTPUT"
          echo "下载 URL: $DL_URL"
          echo "文件名: $FILE_NAME"

      - name: 检查当前版本
        id: check_version
        run: |
          set -euo pipefail
          if [ ! -f "VERSION.txt" ]; then
            echo "未找到版本记录文件，创建新文件"
            touch VERSION.txt
            CURRENT_VERSION=""
          else
            CURRENT_VERSION=$(tr -d '\n\r ' < VERSION.txt)
            echo "当前记录的版本: ${CURRENT_VERSION:-<空>}"
          fi

          NEW_VERSION="${{ steps.get_latest.outputs.version }}"
          echo "latest_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "current_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"

          if [ -z "$CURRENT_VERSION" ] || [ "$CURRENT_VERSION" != "$NEW_VERSION" ]; then
            echo "需要更新: ${CURRENT_VERSION:-<空>} -> $NEW_VERSION"
            echo "need_update=true" >> "$GITHUB_OUTPUT"
          else
            echo "版本相同，无需更新"
            echo "need_update=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 下载并更新文件
        if: steps.check_version.outputs.need_update == 'true'
        run: |
          set -euo pipefail
          DL_URL="${{ steps.get_latest.outputs.download_url }}"
          FILE_NAME="${{ steps.get_latest.outputs.file_name }}"
          VERSION="${{ steps.get_latest.outputs.version }}"

          echo "正在下载: $FILE_NAME <- $DL_URL"
          curl -sSL --fail -o "$FILE_NAME" "$DL_URL"

          if [ "$FILE_NAME" = "Pages.zip" ]; then
            unzip -o "$FILE_NAME" -d .
            rm -f "$FILE_NAME"
            echo "已解压并删除 Pages.zip"
          else
            # 上游只发布 _worker.js
            mv -f "$FILE_NAME" _worker.js
            echo "已更新 _worker.js"
          fi

          echo "$VERSION" > VERSION.txt
          echo "版本记录已更新: $VERSION"
          ls -la

          # 校验产物就是最新内核
          if [ -f "_worker.js" ]; then
            grep -o '2026\.[0-9]*\.[0-9]*\.[0-9]*' _worker.js | sort -u | head -5 || true
          fi

      - name: 提交并推送更改
        if: steps.check_version.outputs.need_update == 'true'
        run: |
          set -euo pipefail
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          if git diff --staged --quiet; then
            echo "没有变更需要提交"
          else
            git commit -m "自动同步: 更新到 cfnew ${{ steps.get_latest.outputs.version }}"
            git push
            echo "已提交并推送更新"
          fi

      - name: 输出摘要
        run: |
          {
            echo "## 同步结果"
            echo "- 最新版本: ${{ steps.get_latest.outputs.version }}"
            echo "- 当前版本: ${{ steps.check_version.outputs.current_version }}"
            if [ "${{ steps.check_version.outputs.need_update }}" = "true" ]; then
              echo "- 状态: 已更新到新版本"
              echo "- 下载文件: ${{ steps.get_latest.outputs.file_name }}"
            else
              echo "- 状态: 版本相同，无需更新"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
